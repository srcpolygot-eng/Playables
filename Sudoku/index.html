<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F5F0" />
  <title>Zenoku — Soft Minimal Sudoku</title>
  <script src="https://www.youtube.com/game_api/v1"></script>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="brand">Zenoku</div>
      <div class="header-right">
        <div class="currency" id="currency">
          <span class="pill" title="Coins">🪙 <b id="coins">0</b></span>
          <span class="pill" title="Gems">💎 <b id="gems">0</b></span>
        </div>
        <div class="timer" id="timer">00:00</div>
        <button class="icon-btn" id="btn-shop" title="Shop">🛒</button>
        <button class="icon-btn" id="btn-bag" title="Items">🎒</button>
        <button class="icon-btn" id="btn-theme" title="Theme">◐</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="difficulty-group" id="diff-group">
        <button class="diff-btn active" data-diff="easy">Easy</button>
        <button class="diff-btn" data-diff="medium">Med</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
        <button class="diff-btn" data-diff="expert">Expert</button>
        <button class="diff-btn daily" data-diff="daily">Daily</button>
      </div>
      <button class="text-btn" id="btn-new">New</button>
    </div>

    <main class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
      <canvas id="confetti" class="confetti" hidden></canvas>
    </main>

    <div class="quick-items" id="quick-items"></div>

    <div class="actions">
      <button class="action-btn" id="btn-notes" title="Notes (N)"><span class="ab-icon">✏️</span><span>Notes</span></button>
      <button class="action-btn" id="btn-undo" title="Undo"><span class="ab-icon">↩️</span><span>Undo</span></button>
      <button class="action-btn" id="btn-hint" title="Hint"><span class="ab-icon">💡</span><span>Hint</span></button>
      <button class="action-btn" id="btn-erase" title="Erase"><span class="ab-icon">⌫</span><span>Erase</span></button>
    </div>

    <div class="numpad" id="numpad">
      <button class="num-btn" data-num="1">1</button>
      <button class="num-btn" data-num="2">2</button>
      <button class="num-btn" data-num="3">3</button>
      <button class="num-btn" data-num="4">4</button>
      <button class="num-btn" data-num="5">5</button>
      <button class="num-btn" data-num="6">6</button>
      <button class="num-btn" data-num="7">7</button>
      <button class="num-btn" data-num="8">8</button>
      <button class="num-btn" data-num="9">9</button>
    </div>

    <!-- Win -->
    <div class="overlay" id="win-overlay" hidden>
      <div class="win-card">
        <div class="win-icon" id="win-icon">✓</div>
        <h2 id="win-title">Completed</h2>
        <p id="win-time">Time: 00:00</p>
        <div class="win-stats" id="win-stats"></div>
        <div class="win-rewards" id="win-rewards"></div>
        <button class="primary-btn" id="btn-win-new">New Game</button>
      </div>
    </div>

    <!-- Shop -->
    <div class="overlay sheet" id="shop-overlay" hidden>
      <div class="sheet-card">
        <div class="sheet-head">
          <h2>Shop</h2>
          <button class="icon-btn" id="btn-shop-close">✕</button>
        </div>
        <div class="sheet-body" id="shop-list"></div>
      </div>
    </div>

    <!-- Bag -->
    <div class="overlay sheet" id="bag-overlay" hidden>
      <div class="sheet-card">
        <div class="sheet-head">
          <h2>Items</h2>
          <button class="icon-btn" id="btn-bag-close">✕</button>
        </div>
        <div class="sheet-body" id="bag-list"></div>
      </div>
    </div>

    <!-- Dev console -->
    <div class="overlay sheet" id="dev-overlay" hidden>
      <div class="sheet-card">
        <div class="sheet-head">
          <h2>Dev Console</h2>
          <button class="icon-btn" id="btn-dev-close">✕</button>
        </div>
        <div class="sheet-body dev-body">
          <button class="text-btn" id="dev-solve">Solve board</button>
          <button class="text-btn" id="dev-coins">+500 coins</button>
          <button class="text-btn" id="dev-gems">+20 gems</button>
          <button class="text-btn" id="dev-reset">Reset economy</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
