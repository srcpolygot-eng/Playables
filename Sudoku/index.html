<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F5F0" />
  <title>Zenoku — Soft Minimal Sudoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="brand">Zenoku</div>
      <div class="header-right">
        <div class="timer" id="timer">00:00</div>
        <button class="icon-btn" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="toolbar">
      <div class="difficulty-group">
        <button class="diff-btn active" data-diff="easy">Easy</button>
        <button class="diff-btn" data-diff="medium">Medium</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
        <button class="diff-btn" data-diff="expert">Expert</button>
      </div>
      <button class="text-btn" id="btn-new">New Game</button>
    </div>

    <main class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
    </main>

    <div class="actions">
      <button class="action-btn" id="btn-notes" title="Notes (N)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span>Notes</span>
      </button>
      <button class="action-btn" id="btn-undo" title="Undo (Ctrl+Z)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
        </svg>
        <span>Undo</span>
      </button>
      <button class="action-btn" id="btn-hint" title="Hint">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span>Hint</span>
      </button>
      <button class="action-btn" id="btn-erase" title="Erase">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 20H7L3 16c-.5-.5-.5-1.5 0-2l9.5-9.5c.5-.5 1.5-.5 2 0L20 10c.5.5.5 1.5 0 2L12 20"/>
          <path d="M18 13l-5 5"/>
        </svg>
        <span>Erase</span>
      </button>
    </div>

    <div class="numpad" id="numpad">
      <button class="num-btn" data-num="1">1</button>
      <button class="num-btn" data-num="2">2</button>
      <button class="num-btn" data-num="3">3</button>
      <button class="num-btn" data-num="4">4</button>
      <button class="num-btn" data-num="5">5</button>
      <button class="num-btn" data-num="6">6</button>
      <button class="num-btn" data-num="7">7</button>
      <button class="num-btn" data-num="8">8</button>
      <button class="num-btn" data-num="9">9</button>
    </div>

    <div class="overlay" id="win-overlay" hidden>
      <div class="win-card">
        <div class="win-icon">✓</div>
        <h2>Completed</h2>
        <p id="win-time">Time: 00:00</p>
        <button class="primary-btn" id="btn-win-new">New Game</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
